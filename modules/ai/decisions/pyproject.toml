[project]
name = "ai-decisions"
version = "0.1.0"
description = "GLiDE-style decision endpoint backed by fastino/GLiNER2.5-Decide"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115",
    "gliner2[local]>=2.0.0",
    "torch>=2.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff"
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.uv]
package = false

# CPU-only torch: the server has no usable GPU, and the CUDA wheels are several GB.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

